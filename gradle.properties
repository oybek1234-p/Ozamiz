# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
org.gradle.jvmargs=-Xmx6g -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m
org.gradle.vfs.watch=true
# Enable parallel execution to utilize multiple CPU cores
org.gradle.parallel=true

# Enable build cache (reuses outputs from previous builds even across branches)
org.gradle.caching=true

# Enable configuration caching (skips execution phase evaluation on unchanged builds)
org.gradle.configuration-cache=true

# Configure on demand (only configures relevant projects)
org.gradle.configureondemand=true

# Force daemon usage for hot JVM
org.gradle.daemon=true

android.useAndroidX=true
kotlin.code.style=official

# Reduce R class size
android.nonTransitiveRClass=true

# Kotlin specific optimizations
kotlin.incremental=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true

# KAPT optimizations (if applicable)
kapt.use.worker.api=true
kapt.incremental.apt=true
kapt.include.compile.classpath=false