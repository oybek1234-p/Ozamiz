# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Maximize memory and enable aggressive garbage collection for Gradle daemon
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m

# Enable parallel execution to utilize multiple CPU cores
org.gradle.parallel=true

# Enable build cache (reuses outputs from previous builds even across branches)
org.gradle.caching=true

# Enable configuration caching (skips execution phase evaluation on unchanged builds)
org.gradle.configuration-cache=true

# Configure on demand (only configures relevant projects)
org.gradle.configureondemand=true

# Force daemon usage for hot JVM
org.gradle.daemon=true

android.useAndroidX=true
kotlin.code.style=official

# Reduce R class size
android.nonTransitiveRClass=true

# Kotlin specific optimizations
kotlin.incremental=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true

# KAPT optimizations (if applicable)
kapt.use.worker.api=true
kapt.incremental.apt=true
kapt.include.compile.classpath=false